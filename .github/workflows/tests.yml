name: tests

# ADR-003: Bu hesapta GitHub Actions kalıcı olarak kullanılamıyor (faturalama kilidi).
# Merge kapısı YEREL: `make gate` (scripts/ci-gate.sh). Bu workflow yalnız elle
# tetiklenir; Actions bir gün erişilebilir olursa push/pull_request tetikleyicileri
# geri eklenir ve ruleset'e "pytest" zorunlu kontrolü konur (REPO_SETTINGS §5).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-test.txt
      # Yerel/devcontainer/ajan oturumuyla aynı kurulum ve aynı komut (CONTRIBUTING §1).
      - name: Setup (scripts/setup-dev.sh)
        run: scripts/setup-dev.sh
      - name: make check (lint + license guard + full test suite)
        run: make check
